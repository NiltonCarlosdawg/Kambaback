# CI — F-023: testes, lint, build e scan de segredos a cada push/PR
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kambapro
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Validador de env do backend exige estas 4 (src/config/envValidator.js),
      # com JWT_SECRET/REFRESH_SECRET ≥32 caracteres e DIFERENTES entre si
      # (secrets abaixo são placeholders de CI — nunca usados em produção).
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kambapro?schema=public
      JWT_SECRET: ci_test_jwt_secret_2026_0123456789_ABC!
      REFRESH_SECRET: ci_test_refresh_secret_2026_0987654321_XYZ@
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo (gitleaks)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: KambApi/package-lock.json
      - name: Instalar dependências
        working-directory: KambApi
        run: npm ci
      - name: Gerar cliente Prisma
        working-directory: KambApi
        run: npx prisma generate
      - name: Lint (ESLint)
        working-directory: KambApi
        run: npm run lint
      - name: Testes (criam kambapro_test, db push e limpam — F-022)
        working-directory: KambApi
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Build (vite)
        working-directory: frontend
        run: npm run build

  secrets:
    name: Gitleaks (scan de segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
